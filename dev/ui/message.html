<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Multichannel</title>
    <style>
      :root {
        --bg: #1a1a1a;
        --panel: #242424;
        --panel-alt: #2c2c2c;
        --line: #383838;
        --text: #dcdcdc;
        --muted: #8a8a8a;
        --accent: #f0a30a;
        --error: #e2564a;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; height: 100%; }

      body {
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      main { flex: 1; min-height: 0; overflow-y: auto; padding: 18px; }

      h1 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 600;
      }

      h1.error { color: var(--error); }

      p {
        margin: 0;
        color: var(--muted);
        white-space: pre-wrap;
        user-select: text;
      }

      footer {
        flex: none;
        display: flex;
        justify-content: flex-end;
        padding: 12px 18px;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }

      button {
        appearance: none;
        border: 1px solid var(--accent);
        border-radius: 5px;
        padding: 6px 20px;
        background: var(--accent);
        color: #1a1a1a;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button.secondary {
        background: var(--panel-alt);
        border-color: var(--line);
        color: var(--text);
        font-weight: 400;
      }

      h1.warning { color: var(--accent); }

      code {
        display: block;
        margin-top: 10px;
        padding: 7px 9px;
        border-radius: 4px;
        background: var(--panel-alt);
        color: var(--text);
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
        user-select: text;
      }

      button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="body"></p>
      <code id="path" hidden></code>
    </main>
    <footer>
      <button type="button" class="secondary" id="cancel" hidden></button>
      <button type="button" id="ok">OK</button>
    </footer>

    <script>
      const MESSAGE = __MCL_MESSAGE__;

      function close(result) {
        const message = { method: "close_and_send", params: [result] };
        if (window.webkit?.messageHandlers?.live) {
          window.webkit.messageHandlers.live.postMessage(message);
        } else if (window.chrome?.webview) {
          window.chrome.webview.postMessage(message);
        }
      }

      const title = document.getElementById("title");
      title.textContent = MESSAGE.title;
      if (MESSAGE.kind === "error" || MESSAGE.kind === "warning") title.className = MESSAGE.kind;
      document.getElementById("body").textContent = MESSAGE.body;

      if (MESSAGE.path) {
        const pathEl = document.getElementById("path");
        pathEl.textContent = MESSAGE.path;
        pathEl.hidden = false;
      }

      const ok = document.getElementById("ok");
      const cancel = document.getElementById("cancel");
      ok.textContent = MESSAGE.confirmLabel || "OK";

      // A cancel label turns this into a confirmation rather than a notice.
      if (MESSAGE.cancelLabel) {
        cancel.textContent = MESSAGE.cancelLabel;
        cancel.hidden = false;
      }

      ok.addEventListener("click", () => close("ok"));
      cancel.addEventListener("click", () => close("cancel"));
      document.addEventListener("keydown", (event) => {
        // Escape must never be read as consent, so it always cancels when
        // there is something to cancel.
        if (event.key === "Escape") close(MESSAGE.cancelLabel ? "cancel" : "ok");
        if (event.key === "Enter") close("ok");
      });

      (MESSAGE.cancelLabel ? cancel : ok).focus();
    </script>
  </body>
</html>
